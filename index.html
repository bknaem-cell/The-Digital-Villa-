<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, orientation=landscape">
    <title>918 Digital Vela</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* মেইন কন্টেইনার */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* প্রোফাইল সার্কেল */
        .profile-holder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #333;
            background: #111;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* টেক্সট ডিজাইন */
        .sweet-text {
            font-size: 14px;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* লোডিং বক্স */
        .progress-box {
            width: 250px;
            height: 6px;
            background: #1a1a1a;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0000, #ff4d4d);
            box-shadow: 0 0 10px #ff0000;
            transition: width 0.1s;
        }

        /* পারসেন্টেজ ও স্ট্যাটাস */
        .status-text {
            font-size: 12px;
            color: #888;
        }

        /* ভাসমান রুপোর ব্যাক বাটন (নিয়ন রেড) */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e0e0e0; /* রুপোর মতো কালার */
            border: 2px solid #ff0000;
            color: #ff0000;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px #ff0000, inset 0 0 10px #fff;
            cursor: pointer;
            text-decoration: none;
            font-size: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <a href="#" class="back-btn">×</a>

    <div class="loading-container">
        <div class="profile-holder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="#333"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>

        <div class="sweet-text">NI MY SWEET</div>

        <div class="progress-box">
            <div class="progress-fill" id="fill"></div>
        </div>

        <div class="status-text">চালু হচ্ছে... <span id="percent">0</span>%</div>
    </div>

    <script>
        let progress = 0;
        const fill = document.getElementById('fill');
        const percentText = document.getElementById('percent');

        // লোডিং এনিমেশন কন্ট্রোল (২ সেকেন্ডের জন্য)
        const interval = setInterval(() => {
            progress += 1;
            fill.style.width = progress + '%';
            percentText.innerText = progress;

            if (progress >= 100) {
                clearInterval(interval);
                // লোডিং শেষ হলে এখানে পরবর্তী পেজের কোড আসবে
            }
        }, 20); // ২ সেকেন্ডে শেষ করার গতি
    </script>
</body>
</html>
